[package]
name = "light-factory-tui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Terminal UI client for the light-factory agentic coding platform"

[[bin]]
name = "light-factory"
path = "src/main.rs"

[lib]
name = "light_factory_tui"
path = "src/lib.rs"

[package.metadata.deb]
maintainer = "Savvagent <rob@hixfamily.org>"
section = "utils"
priority = "optional"

[package.metadata.generate-rpm]
license = "MIT OR Apache-2.0"
summary = "Terminal UI client for the light-factory agentic coding platform"
assets = [
  { source = "target/release/light-factory", dest = "/usr/bin/light-factory", mode = "755" },
]

[dependencies]
light-factory-protocol = { path = "../protocol" }
light-factory-providers = { path = "../providers" }
light-factory-engine = { path = "../engine" }
ratatui = { workspace = true, features = ["crossterm"] }
crossterm = { workspace = true, features = ["event-stream"] }
reqwest = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
futures-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
uuid = { workspace = true }
keyring = { version = "3.6", features = [
    "apple-native",
    "windows-native",
    "sync-secret-service",
] }
