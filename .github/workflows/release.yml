# Semver release workflow: build installers for a `v*` tag and publish a GitHub Release.
#
# Tags are created by the "Bump Version" workflow (bump.yml), which pushes them
# using a PAT so this workflow is triggered.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  RUST_BACKTRACE: 0

jobs:
  prepare:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Resolve version
        id: resolve
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

  linux:
    name: Linux (.deb, .rpm, .tar.gz)
    runs-on: ubuntu-latest
    needs: prepare
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.prepare.outputs.version }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install packaging tools
        run: cargo install cargo-deb cargo-generate-rpm --locked
      - name: Build release binary
        run: cargo build --release -p light-factory-tui
      - name: Package .deb
        run: cargo deb -p light-factory-tui --no-build
      - name: Package .rpm
        run: cargo generate-rpm -p crates/tui
      - name: Linux tarball
        run: |
          mkdir -p dist/light-factory
          cp target/release/light-factory dist/light-factory/
          tar -czf "light-factory-${VERSION}-x86_64-unknown-linux-gnu.tar.gz" -C dist light-factory
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            target/debian/*.deb
            target/generate-rpm/*.rpm
            light-factory-*.tar.gz

  macos:
    name: macOS (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            arch: aarch64-apple-darwin
          - os: macos-13
            arch: x86_64-apple-darwin
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.prepare.outputs.version }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release binary
        run: cargo build --release -p light-factory-tui
      - name: Tarball
        run: |
          mkdir -p dist/light-factory
          cp target/release/light-factory dist/light-factory/
          tar -czf "light-factory-${VERSION}-${{ matrix.arch }}.tar.gz" -C dist light-factory
      - name: DMG
        run: |
          hdiutil create -volname "light-factory" -srcfolder dist -ov -format UDZO \
            "light-factory-${VERSION}-${{ matrix.arch }}.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: |
            light-factory-*.tar.gz
            light-factory-*.dmg

  windows:
    name: Windows (x86_64)
    runs-on: windows-latest
    needs: prepare
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.prepare.outputs.version }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release binary
        run: cargo build --release -p light-factory-tui
      - name: Zip
        shell: pwsh
        run: |
          Compress-Archive -Path target\release\light-factory.exe `
            -DestinationPath "light-factory-${{ env.VERSION }}-x86_64-pc-windows-msvc.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: light-factory-*.zip

  publish:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [prepare, linux, macos, windows]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        run: cd artifacts && sha256sum * > checksums.txt
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          name: v${{ needs.prepare.outputs.version }}
          generate_release_notes: true
          files: artifacts/*
