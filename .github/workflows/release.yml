# Semver release workflow: build installers for a `v*` tag and publish a GitHub Release.
#
# Tags are created by the "Bump Version" workflow (bump.yml), which pushes them
# using a PAT so this workflow is triggered.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  RUST_BACKTRACE: 0

jobs:
  prepare:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Resolve version
        id: resolve
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

  linux:
    name: Linux (.deb, .rpm, .tar.gz)
    runs-on: ubuntu-latest
    needs: prepare
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: v${{ needs.prepare.outputs.version }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Install packaging tools
        run: cargo install cargo-deb cargo-generate-rpm --locked
      - name: Install Linux build dependencies (keyring/dbus)
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - name: Build release binary
        run: cargo build --release -p light-factory-tui
      - name: Package .deb
        run: cargo deb -p light-factory-tui --no-build
      - name: Package .rpm
        run: cargo generate-rpm -p crates/tui
      - name: Stage release artifacts
        run: |
          tar -czf "light-factory-${VERSION}-x86_64-unknown-linux-gnu.tar.gz" -C target/release light-factory
          cp target/debian/*.deb .
          cp target/generate-rpm/*.rpm .
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: linux
          path: |
            *.deb
            *.rpm
            light-factory-*.tar.gz

  macos:
    name: macOS (aarch64-apple-darwin)
    runs-on: macos-latest
    needs: prepare
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: v${{ needs.prepare.outputs.version }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Build release binary
        run: cargo build --release -p light-factory-tui
      - name: Tarball
        run: |
          mkdir -p dist/light-factory
          cp target/release/light-factory dist/light-factory/
          tar -czf "light-factory-${VERSION}-aarch64-apple-darwin.tar.gz" -C dist light-factory
      - name: DMG
        run: |
          hdiutil create -volname "light-factory" -srcfolder dist -ov -format UDZO \
            "light-factory-${VERSION}-aarch64-apple-darwin.dmg"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: macos-aarch64-apple-darwin
          path: |
            light-factory-*.tar.gz
            light-factory-*.dmg

  windows:
    name: Windows (x86_64)
    runs-on: windows-latest
    needs: prepare
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: v${{ needs.prepare.outputs.version }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Build release binary
        run: cargo build --release -p light-factory-tui
      - name: Zip
        shell: pwsh
        run: |
          Compress-Archive -Path target\release\light-factory.exe `
            -DestinationPath "light-factory-${{ env.VERSION }}-x86_64-pc-windows-msvc.zip"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: windows
          path: light-factory-*.zip

  publish:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [prepare, linux, macos, windows]
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        run: cd artifacts && sha256sum * > checksums.txt
      - name: Create release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          name: v${{ needs.prepare.outputs.version }}
          generate_release_notes: true
          files: artifacts/*
